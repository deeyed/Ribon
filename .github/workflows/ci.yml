name: Ribon CI

on:
  push:
  pull_request:

concurrency:
  group: ribon-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QSTAR_REVISION: 49d4b04b05ae7a7f6ed10d0c363fadcfac6b8387

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm opensbi openssl ovmf python3 \
            qemu-system-arm qemu-system-misc qemu-system-x86 ripgrep
      - name: Install pinned QStar
        run: |
          git init "$RUNNER_TEMP/qstar"
          git -C "$RUNNER_TEMP/qstar" remote add origin \
            https://github.com/deeyed/qstar.git
          git -C "$RUNNER_TEMP/qstar" fetch --depth 1 origin "$QSTAR_REVISION"
          git -C "$RUNNER_TEMP/qstar" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/qstar" submodule update --init --recursive --depth 1
          make -C "$RUNNER_TEMP/qstar" all
          echo "$RUNNER_TEMP/qstar/build/bin" >> "$GITHUB_PATH"
      - name: Host and cross-compile aggregate
        run: make ci-host CC=clang
      - name: Preserve host failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ribon-host-failure-${{ github.sha }}
          path: |
            build/**/*.json
            build/**/*.log
            build/**/*.txt
          if-no-files-found: ignore

  targets-and-qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install target and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm opensbi openssl ovmf python3 \
            qemu-system-arm qemu-system-misc qemu-system-x86 ripgrep
      - uses: actions/cache@v5
        with:
          path: build/external
          key: ribon-external-${{ hashFiles('external/inputs/*.json') }}
      - name: Build supported target products
        run: make ci-targets CC=clang
      - name: Execute architecture fixtures
        run: make ci-qemu CC=clang

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3 python3-pip ripgrep
          python3 -m pip install --break-system-packages -r docs/requirements.txt
      - name: Build documentation
        run: make ci-docs
